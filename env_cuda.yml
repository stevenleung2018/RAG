name: rag
channels:
  - conda-forge
  - huggingface
dependencies:
  - python=3.12
  - transformers=4.54
  - tokenizers
  - accelerate
  - requests
  - pip
  - pip:
    - torch==2.5.1+cu124 # please change to your cuda version, e.g., cu118, cu121, cu124
    - torchvision
    - torchaudio
    - --index-url https://download.pytorch.org/whl/cu124 # please change to your cuda version, e.g., cu118, cu121, cu124
    - pymupdf  # for fitz
    - langchain
    - langchain-huggingface
    - langchain-community
    - faiss-cpu  # or faiss-gpu if you have GPU support for FAISS
    - sentence-transformers
    - bitsandbytes
    - ipykernel
    - ipython
    - ipywidgets
    - raghilda
    - chatlas
    - orjson