name: Quick Tests

on:
  push:
    branches: [ main, steven, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quick-test:
    name: Quick Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers sentence-transformers langchain langchain-community langchain-huggingface pymupdf faiss-cpu accelerate bitsandbytes scikit-learn pandas scipy ipykernel pytest

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            test-output.xml
            .pytest_cache/
          retention-days: 30
