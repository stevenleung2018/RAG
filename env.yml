name: langchain-rag
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26  # Avoid NumPy 2.x issues with PyTorch
  - pip:
      - torch==2.1.2
      - torchvision
      - torchaudio
      - langchain
      - transformers
      - sentence-transformers
      - faiss-cpu
      - pymupdf
      - accelerate
      - python-dotenv